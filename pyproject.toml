[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-seller"
version = "0.1.0"
description = "Telegram bot for selling VPN access from inventory, Hiddify servers, and aggregated superkeys"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4,<4.0",
  "alembic>=1.13,<2.0",
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.29,<1.0",
  "cryptography>=46.0.6,<47.0",
  "fastapi>=0.110,<0.136.3",
  "httpx>=0.27,<1.0",
  "openpyxl>=3.1,<4.0",
  "pydantic-settings>=2.2,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.3.0,<2.0",
  "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
