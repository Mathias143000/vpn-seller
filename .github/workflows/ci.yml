name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile and test
        run: |
          python -m compileall app tests
          pytest -q

      - name: Dependency audit
        run: python -m pip_audit -r requirements-dev.txt

      - name: Compose config
        run: docker compose config --quiet

      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output artifacts/hardening/sbom.cdx.json
