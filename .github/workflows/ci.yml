name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Compile and test
        run: |
          python -m compileall app tests
          pytest -q

      - name: Dependency audit
        run: python -m pip_audit -r requirements-dev.txt

      - name: Compose config
        run: docker compose config --quiet

      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output artifacts/hardening/sbom.cdx.json
