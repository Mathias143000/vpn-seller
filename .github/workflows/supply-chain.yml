name: supply-chain

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image-supply-chain:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/vpn-seller
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Test
        run: |
          python -m compileall app tests
          pytest -q

      - name: Prepare image tag
        run: |
          echo "IMAGE_URI=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --pull --tag "${IMAGE_URI}" .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/vpn-seller:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM
        run: python scripts/generate_sbom.py --output artifacts/supply-chain/sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vpn-seller-sbom-${{ github.sha }}
          path: artifacts/supply-chain/sbom.cdx.json
          if-no-files-found: error

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE_URI}"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign image with keyless cosign
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE_URI}"

      - name: Verify keyless signature
        if: github.event_name != 'pull_request'
        run: |
          cosign verify "${IMAGE_URI}" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/supply-chain.yml@refs/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
