services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vpn_seller
      POSTGRES_USER: vpn_seller
      POSTGRES_PASSWORD: vpn_seller
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_seller -d vpn_seller"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: polling
      DATABASE_URL: postgresql+asyncpg://vpn_seller:vpn_seller@db:5432/vpn_seller
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.main", "--polling"]

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: web
      DATABASE_URL: postgresql+asyncpg://vpn_seller:vpn_seller@db:5432/vpn_seller
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${APP_BIND_PORT:-18080}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
