stages:
  - validate
  - security
  - image

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

python-validate:
  stage: validate
  image: python:3.11-slim
  cache:
    key: pip
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt
  script:
    - python -m compileall app tests
    - pytest -q
    - python -m pip_audit -r requirements-dev.txt
    - python scripts/generate_sbom.py --output artifacts/hardening/sbom.cdx.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/hardening/sbom.cdx.json

compose-config:
  stage: validate
  image: docker:27.5.1-cli
  script:
    - docker compose config --quiet

trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.70.0
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

container-build:
  stage: image
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --pull --tag "$IMAGE_TAG" .
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker push "$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never
